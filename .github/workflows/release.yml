name: Production release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      RUSTFLAGS: -D warnings
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check and bundle
        run: |
          test "$(uname -m)" = arm64
          rustup update stable
          rustup default stable
          cargo test --locked
          cargo build --locked
          base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          prefix=${base%.*}
          patch=${base##*.}
          export RELEASE_VERSION="$prefix.$((patch + GITHUB_RUN_NUMBER))"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          sh scripts/bundle.sh
      - name: Publish release
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/Termi.zip --clobber
          else
            gh release create "$tag" dist/Termi.zip \
              --target "$GITHUB_SHA" --title "Termi $RELEASE_VERSION" \
              --generate-notes --latest
          fi
      - name: Update Homebrew cask
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/termi.rb
          git diff --cached --quiet && exit 0
          git commit -m "build: publish termi v$RELEASE_VERSION"
          git pull --rebase origin main
          git push origin HEAD:main
