[package]
name = "termi"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
alacritty_terminal = "0.26.0"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["syntect"] }
libc = "0.2.190"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }
