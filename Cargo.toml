[package]
name = "termi"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
alacritty_terminal = "0.26.0"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["syntect"] }
libc = "0.2.190"
raw-window-handle = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-themes", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }
